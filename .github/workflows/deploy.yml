name: Test and publish

# Every push to main: run the tests, check index.html was rebuilt from the settings,
# then publish the site to the gh-pages branch (served by GitHub Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: index.html matches clinic.config.mjs
        run: |
          node tools/build.mjs
          git diff --exit-code --ignore-all-space -- index.html || { echo "::error::index.html is out of date. Run 'node tools/build.mjs' and commit the result."; exit 1; }
      - name: Publish to gh-pages
        run: |
          mkdir -p ../site && cp -r index.html assets .nojekyll ../site/ && cd ../site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
